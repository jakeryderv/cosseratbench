[project]
name = "cosseratbench"
version = "0.3.0"
description = "A visual benchmark suite for rope, cable, and Cosserat rod simulation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jake Van Slyke" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
pyelastica = ["pyelastica>=1.0"]
mujoco = ["mujoco>=3.2"]
all = ["cosseratbench[pyelastica,mujoco]"]

[project.urls]
Repository = "https://github.com/jakeryderv/cosseratbench"

[project.scripts]
cosseratbench = "cosseratbench.cli:main"

# Built-in solvers and experiments register through the same entry points
# that third-party packages use.
[project.entry-points."cosseratbench.solvers"]
pyelastica = "cosseratbench.solvers.pyelastica:PyElasticaSolver"
mujoco = "cosseratbench.solvers.mujoco:MuJoCoSolver"
dismech = "cosseratbench.solvers.dismech:DismechSolver"

[project.entry-points."cosseratbench.experiments"]
catenary = "cosseratbench.experiments.catenary:catenary"
cantilever = "cosseratbench.experiments.cantilever:cantilever"
pendulum = "cosseratbench.experiments.pendulum:pendulum"
twist = "cosseratbench.experiments.twist:twist"
capstan = "cosseratbench.experiments.capstan:capstan"
crossing = "cosseratbench.experiments.crossing:crossing"
pile = "cosseratbench.experiments.pile:pile"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# dismech-python is not on PyPI and is GPL-3.0, so it is not an extra of this package:
# install this group to run its adapter (Python 3.13 or later). It imports IPython
# without declaring it.
dismech = [
    "dismech-python @ git+https://github.com/StructuresComp/dismech-python.git@3d83a30066461da3407e7f08aeaf85f16ae8ea12 ; python_full_version >= '3.13'",
    "ipython>=8 ; python_full_version >= '3.13'",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a full simulation"]
